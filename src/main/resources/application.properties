spring.application.name=java-hexagonal-template

# Local defaults are aligned with infrastructure/compose.yaml.
# Override any value with environment variables in higher environments.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:payment_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${MYSQL_USER:payment_user}
spring.datasource.password=${MYSQL_PASSWORD:payment_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
