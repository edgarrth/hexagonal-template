services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payment_management}
      MYSQL_USER: ${MYSQL_USER:-payment_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-payment_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-payment_management}
      MYSQL_USER: ${MYSQL_USER:-payment_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-payment_password}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
